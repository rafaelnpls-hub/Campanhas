<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Campanhas</title>

  <style>
    :root {
      --bg1: #f8fafc;
      --bg2: #eef4fa;
      --card: rgba(255, 255, 255, 0.92);
      --text: #1d3557;
      --subtext: #6b7280;
      --footer: #9ca3af;
      --border: rgba(255, 255, 255, 0.8);
      --toggle-bg: #ffffff;
      --toggle-text: #1d3557;
      --toggle-shadow: rgba(0,0,0,0.12);
    }

    body.dark {
      --bg1: #0f172a;
      --bg2: #111827;
      --card: rgba(17, 24, 39, 0.94);
      --text: #f8fafc;
      --subtext: #cbd5e1;
      --footer: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --toggle-bg: #1f2937;
      --toggle-text: #ffffff;
      --toggle-shadow: rgba(0,0,0,0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, rgba(255, 214, 0, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 86, 179, 0.25), transparent 40%),
        linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      padding: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      border: 1px solid var(--border);
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--toggle-shadow);
      transition: all 0.25s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border-radius: 28px;
      padding: 60px 45px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .logo-area {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      background: linear-gradient(135deg, #ffd500, #ffb800);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 30px rgba(255, 193, 7, 0.35);
    }

    h1 {
      color: var(--text);
      font-size: 38px;
      margin-bottom: 12px;
      font-weight: 800;
      transition: color 0.3s ease;
    }

    .subtitle {
      color: var(--subtext);
      font-size: 17px;
      margin-bottom: 42px;
      transition: color 0.3s ease;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .team-button {
      border: none;
      border-radius: 18px;
      padding: 25px 20px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 125px;
      overflow: hidden;
    }

    .team-button span {
      position: relative;
      z-index: 2;
    }

    .team-button small {
      position: relative;
      z-index: 2;
      font-size: 13px;
      margin-top: 8px;
      opacity: 0.8;
      font-weight: 500;
    }

    .conta-chave {
      background: linear-gradient(135deg, #ffd500, #ffb800);
      color: #2d2d2d;
      box-shadow: 0 12px 30px rgba(255, 193, 7, 0.25);
    }

    .varejo {
      background: linear-gradient(135deg, #0056b3, #003f88);
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(0, 86, 179, 0.25);
    }

    .team-button:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .conta-chave:hover {
      box-shadow: 0 18px 35px rgba(255, 193, 7, 0.4);
    }

    .varejo:hover {
      box-shadow: 0 18px 35px rgba(0, 86, 179, 0.4);
    }

    .team-button:active {
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 38px;
      font-size: 13px;
      color: var(--footer);
      transition: color 0.3s ease;
    }

    @media (max-width: 600px) {
      .theme-toggle {
        top: 14px;
        left: 14px;
        padding: 9px 13px;
        font-size: 13px;
      }

      .container {
        padding: 45px 25px;
      }

      h1 {
        font-size: 30px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .team-button {
        min-height: 105px;
      }
    }
  </style>
</head>

<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
    🌙 Tema escuro
  </button>

  <main class="container">
    <div class="logo-area">🚀</div>

    <h1>Escolha Sua Equipe</h1>

    <p class="subtitle">
      Selecione sua equipe para acessar a central de campanhas.
    </p>

    <div class="buttons">
      <a class="team-button conta-chave" href="https://campanhacc.netlify.app/">
        <span>Conta Chave</span>
        <small>Acessar campanhas</small>
      </a>

      <a class="team-button varejo" href="https://campanhavj.netlify.app/">
        <span>Varejo</span>
        <small>Acessar campanhas</small>
      </a>
    </div>

    <div class="footer">
      Central de Campanhas
    </div>
  </main>

  <script>
    const toggle = document.getElementById('themeToggle');

    function aplicarTema(tema) {
      const escuro = tema === 'dark';
      document.body.classList.toggle('dark', escuro);
      toggle.textContent = escuro ? '☀️ Tema claro' : '🌙 Tema escuro';
      localStorage.setItem('temaCentralCampanhas', tema);
    }

    const temaSalvo = localStorage.getItem('temaCentralCampanhas');
    if (temaSalvo) {
      aplicarTema(temaSalvo);
    }

    toggle.addEventListener('click', () => {
      const escuro = document.body.classList.contains('dark');
      aplicarTema(escuro ? 'light' : 'dark');
    });
  </script>
</body>
</html>
